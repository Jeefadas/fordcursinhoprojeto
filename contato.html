<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ford</title>    
    <link href="css/reset.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <link href="css/form.css" rel="stylesheet">
    <script src="js/form.js" defer></script>
</head>
<body>
    <header>       
        <div>
            <img src="img/logo-ford-256.png" width="150" class="logo" />
        </div>
        <nav>
            <ul>
                <li>
                    <a href="index.html">Home</a>
                </li>
                <li>
                    <a href="lancamento.html">Lançamento</a>
                </li>
                <li>
                    <a href="contato.html">Contato</a>
                </li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="forms">
            <div>
                <img src="img/xls 2.2 diesel.jpg">
            </div>
            <div>
                <h2 class="titulo">Sobre Você</h2>
                <form id="contact-form">
                    <input type="text" id="nome" name="nome" placeholder="NOME*" class="fordform" required>
                    <input type="email" id="email" name="email" placeholder="E-MAIL*" class="fordform" required>
                    <input type="tel" id="telefone" name="telefone" placeholder="TELEFONE*" class="fordform" required>

                    <select id="tipo-contato" name="tipoContato" class="fordform" required>
                        <option value="" selected disabled>TIPO DE CONTATO*</option>
                        <option value="elogio">ELOGIO</option>
                        <option value="reclamacao">RECLAMAÇÃO</option>
                        <option value="solicitacao">SOLICITAÇÃO</option>
                    </select>

                    <textarea id="mensagem" name="mensagem" placeholder="MENSAGEM*" class="fordform mensagem" required></textarea>

                    <button type="submit">Enviar</button>
                </form>
            </div>
        </div>
    </main>

    <footer>
        <nav id="social">
            <ul>
                <li><span class="redesociais">Redes Sociais</span></li>
                <li><a href="#" title="Facebook"><img src="img/facebook-50.png"></a></li>
                <li><a href="#" title="YouTube"><img src="img/youtube-squared-50.png"></a></li>
                <li><a href="#" title="Instagram"><img src="img/instagram-logo-50.png"></a></li>
            </ul>
        </nav>
        <div>
           <img src="img/ford-96.png" width="70" />
        </div>
    </footer>
</body>
</html>
